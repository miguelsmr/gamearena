/* =========================================================
   GAMEARENA · TOKENS DE LA GUÍA DE ESTILO
   ========================================================= */
:root{
  /* Color */
  --bg:#0B0F1A; --surface:#131A2B; --surface-2:#1B2338; --border:#2A3450;
  --text:#EEF2FA; --text-2:#9AA5BF;
  --primary:#6D4AFF; --primary-hover:#7C5CFF; --accent:#22D3EE;
  --ok:#34D399; --warn:#FBBF24; --muted:#94A3B8; --danger:#F87171; --danger-strong:#DC2626;
  /* Tipografía */
  --f-display:"Chakra Petch",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif;
  --fs-xs:.75rem; --fs-sm:.875rem; --fs-base:1rem; --fs-md:1.25rem; --fs-lg:1.5625rem; --fs-xl:1.9375rem; --fs-xxl:2.4375rem; --fs-display:3.0625rem;
  /* Espaciado (base 4 px) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  /* Forma */
  --r-sm:8px; --r-md:12px; --r-pill:999px;
  --container:1200px; --gutter:24px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:var(--fs-base);line-height:1.6;min-height:100vh;
  background-image:radial-gradient(1000px 500px at 85% -10%,rgba(109,74,255,.18),transparent 60%),radial-gradient(800px 400px at -10% 10%,rgba(34,211,238,.08),transparent 60%);background-attachment:fixed}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Tipografía ---------- */
h1,h2,h3,.display{font-family:var(--f-display);line-height:1.15;letter-spacing:.01em}
h1{font-size:var(--fs-xxl);font-weight:700}
h2{font-size:var(--fs-xl);font-weight:700}
h3{font-size:var(--fs-md);font-weight:600}
.display{font-size:var(--fs-display);font-weight:700}
.overline{font-family:var(--f-display);font-size:var(--fs-xs);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lead{font-size:var(--fs-md);color:var(--text-2);line-height:1.5}
.muted{color:var(--text-2)}
.small{font-size:var(--fs-sm)}
.grad{background:linear-gradient(90deg,var(--accent),#A78BFA);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- Retícula ---------- */
.container{max-width:var(--container);margin:0 auto;padding:0 var(--gutter)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--gutter)}
.c-12{grid-column:span 12}.c-8{grid-column:span 8}.c-6{grid-column:span 6}.c-4{grid-column:span 4}.c-3{grid-column:span 3}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gutter)}
.stack>*+*{margin-top:var(--s4)}

/* ---------- Cabecera ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(11,15,26,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar .container{display:flex;align-items:center;gap:var(--s6);height:68px}
.brand{display:flex;align-items:center;gap:var(--s3);font-family:var(--f-display);font-weight:700;font-size:var(--fs-md);color:var(--text)}
.brand:hover{text-decoration:none}
.logo{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--accent));font-size:var(--fs-sm);color:#fff;box-shadow:0 0 18px rgba(109,74,255,.5)}
.brand b{color:var(--accent);font-weight:700}
.nav{display:flex;gap:var(--s1);flex:1}
.nav a{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3);border-radius:var(--r-sm);color:var(--text-2);font-weight:500;font-size:var(--fs-sm);position:relative}
.nav a:hover{color:var(--text);background:var(--surface);text-decoration:none}
.nav a.on{color:var(--text)}
.nav a.on::after{content:"";position:absolute;left:var(--s3);right:var(--s3);bottom:-14px;height:3px;border-radius:3px;background:var(--accent)}
.tabbar{display:none}

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:44px;padding:0 var(--s5);border-radius:var(--r-sm);border:1px solid transparent;font-weight:600;font-size:var(--fs-sm);cursor:pointer;transition:.15s;white-space:nowrap;text-decoration:none!important}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 6px 18px rgba(109,74,255,.35)}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px)}
.btn-secondary{background:transparent;color:var(--text);border-color:var(--border)}
.btn-secondary:hover{border-color:var(--text-2);background:var(--surface-2)}
.btn-ghost{background:transparent;color:var(--text-2);padding:0 var(--s3)}
.btn-ghost:hover{color:var(--text);background:var(--surface-2)}
.btn-danger{background:var(--danger-strong);color:#fff}
.btn-danger:hover{filter:brightness(1.1)}
.btn-danger-ghost{background:transparent;color:var(--danger);border-color:rgba(248,113,113,.4)}
.btn-danger-ghost:hover{background:rgba(248,113,113,.1)}
.btn-sm{height:34px;padding:0 var(--s3);font-size:var(--fs-xs)}
.btn-icon{width:34px;padding:0}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}

/* ---------- Estados de torneo ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid;white-space:nowrap}
.badge svg{width:12px;height:12px;stroke-width:3}
.st-ABIERTO{color:var(--ok);background:rgba(52,211,153,.12);border-color:rgba(52,211,153,.4)}
.st-EN_CURSO{color:var(--warn);background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.4)}
.st-FINALIZADO{color:var(--muted);background:rgba(148,163,184,.12);border-color:rgba(148,163,184,.35)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%{box-shadow:0 0 0 6px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}

/* ---------- Tarjetas ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s5)}
.card-t{position:relative;display:flex;flex-direction:column;gap:var(--s4);border-left:4px solid var(--border);transition:.18s;color:var(--text)}
.card-t:hover{transform:translateY(-3px);border-color:var(--text-2);box-shadow:var(--shadow);text-decoration:none}
.card-t.b-ABIERTO{border-left-color:var(--ok)}.card-t.b-EN_CURSO{border-left-color:var(--warn)}.card-t.b-FINALIZADO{border-left-color:var(--muted)}
.card-t .top{display:flex;justify-content:space-between;align-items:center;gap:var(--s3)}
.card-t h3{font-size:var(--fs-md)}
.meta{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s4);font-size:var(--fs-sm);color:var(--text-2)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:15px;height:15px}
.card-t .foot{display:flex;justify-content:space-between;align-items:center;padding-top:var(--s4);border-top:1px solid var(--border);margin-top:auto}
.prize{font-family:var(--f-display);font-weight:700;font-size:var(--fs-md);color:var(--text)}
.prize small{font-family:var(--f-body);font-size:var(--fs-xs);color:var(--text-2);font-weight:500;display:block;letter-spacing:.06em;text-transform:uppercase}
.link-more{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:600;color:var(--accent)}

.game{display:inline-flex;align-items:center;gap:var(--s2);font-size:var(--fs-sm);font-weight:500;color:var(--text)}
.gtile{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:10px;color:#fff;letter-spacing:.02em;flex:none}
.gtile.lg{width:56px;height:56px;border-radius:12px;font-size:var(--fs-base)}
.gtile.xl{width:88px;height:88px;border-radius:16px;font-size:var(--fs-lg)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:var(--fs-sm);background:var(--surface-2);border:1px solid var(--border);color:var(--accent);flex:none}
.avatar.xl{width:88px;height:88px;font-size:var(--fs-xl)}

/* ---------- Tablas ---------- */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
th{text-align:left;font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);font-weight:600;padding:var(--s3) var(--s4);background:var(--surface-2);border-bottom:1px solid var(--border)}
td{padding:var(--s3) var(--s4);border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:.12s}
tbody tr:hover{background:rgba(255,255,255,.025)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:var(--s3)}
.who b{display:block;font-weight:600}
.actions{display:flex;gap:var(--s1);justify-content:flex-end}
td.actions{display:table-cell;text-align:right;white-space:nowrap}
td.actions>*+*{margin-left:var(--s1)}
.level{display:flex;align-items:center;gap:var(--s2)}
.level .bar{width:80px;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.level .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent))}
.pos{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-family:var(--f-display);font-weight:700;font-size:var(--fs-sm);background:var(--surface-2);border:1px solid var(--border)}
.pos.p1{background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#1a1300;border:0}
.pos.p2{background:linear-gradient(135deg,#E2E8F0,#94A3B8);color:#0B0F1A;border:0}
.pos.p3{background:linear-gradient(135deg,#F0A36B,#C2703D);color:#1a0d00;border:0}

/* ---------- Formularios ---------- */
.field{display:flex;flex-direction:column;gap:6px}
label,.label{font-size:var(--fs-sm);font-weight:600;color:var(--text)}
.req{color:var(--accent)}
.input,select.input{height:44px;padding:0 var(--s3);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);transition:.15s;width:100%}
.input:hover{border-color:var(--text-2)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.2)}
.input.err{border-color:var(--danger)}
.help{font-size:var(--fs-xs);color:var(--text-2)}
.error{font-size:var(--fs-xs);color:var(--danger);display:none;align-items:center;gap:4px}
.field.bad .error{display:flex}
.field.bad .input{border-color:var(--danger)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5)}
.form-grid .full{grid-column:1/-1}
.form-actions{display:flex;gap:var(--s3);justify-content:flex-end;padding-top:var(--s5);margin-top:var(--s5);border-top:1px solid var(--border)}
.radio-states{display:flex;gap:var(--s3);flex-wrap:wrap}
.radio-states label{cursor:pointer}
.radio-states input{position:absolute;opacity:0}
.radio-states .badge{height:36px;padding:0 var(--s4);opacity:.45;transition:.15s}
.radio-states input:checked+.badge{opacity:1;box-shadow:0 0 0 2px var(--bg),0 0 0 4px currentColor}
.radio-states input:focus-visible+.badge{outline:2px solid var(--accent);outline-offset:4px}

/* ---------- Filtros ---------- */
.filters{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--s4);padding:var(--s4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md)}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg a{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 var(--s3);border-radius:6px;font-size:var(--fs-sm);font-weight:600;color:var(--text-2)}
.seg a:hover{color:var(--text);text-decoration:none}
.seg a.on{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border)}
.seg a .dot{animation:none;width:7px;height:7px}
.result-line{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2);font-size:var(--fs-sm);color:var(--text-2);margin:var(--s5) 0 var(--s4)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 10px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:var(--fs-xs);font-weight:600}
.chip a{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;color:var(--text-2)}
.chip a:hover{background:var(--border);color:var(--text)}
.chip svg{width:12px;height:12px}

/* ---------- Página ---------- */
main.container{padding-top:var(--s6);padding-bottom:var(--s8)}
.crumbs{display:flex;align-items:center;gap:var(--s2);font-size:var(--fs-sm);color:var(--text-2);margin-bottom:var(--s4)}
.crumbs a{color:var(--text-2)}.crumbs a:hover{color:var(--text)}
.crumbs svg{width:14px;height:14px}
.crumbs span:last-child{color:var(--text)}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--s5);margin-bottom:var(--s6);flex-wrap:wrap}
.page-head p{color:var(--text-2);margin-top:var(--s2);max-width:60ch}
.page-head .acts{display:flex;gap:var(--s3);flex-wrap:wrap}
.section{margin-top:var(--s7)}
.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--s4);gap:var(--s4)}
.section-head h2{font-size:var(--fs-lg)}

/* Hero */
.hero{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:20px;padding:var(--s8) var(--s7);background:linear-gradient(135deg,rgba(109,74,255,.22),rgba(19,26,43,.6) 55%,rgba(34,211,238,.12))}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:380px;height:380px;border-radius:50%;border:1px solid rgba(34,211,238,.25);box-shadow:inset 0 0 80px rgba(109,74,255,.25)}
.hero::before{content:"";position:absolute;right:60px;top:60px;width:180px;height:180px;border-radius:50%;border:1px dashed rgba(167,139,250,.35)}
.hero>*{position:relative;z-index:1;max-width:640px}
.hero .display{margin:var(--s3) 0 var(--s4)}
.hero .acts{display:flex;gap:var(--s3);margin-top:var(--s6);flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gutter);margin-top:var(--gutter)}
.stat{display:flex;align-items:center;gap:var(--s4)}
.stat .ic{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent)}
.stat .ic svg{width:22px;height:22px}
.stat b{display:block;font-family:var(--f-display);font-size:var(--fs-xl);line-height:1}
.stat span{font-size:var(--fs-sm);color:var(--text-2)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gutter)}
.quick a{display:flex;flex-direction:column;gap:var(--s3);color:var(--text);transition:.18s}
.quick a:hover{text-decoration:none;border-color:var(--accent);transform:translateY(-3px)}
.quick .ic{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:rgba(109,74,255,.18);color:#A78BFA}
.quick p{font-size:var(--fs-sm);color:var(--text-2)}
.games{display:grid;grid-template-columns:repeat(5,1fr);gap:var(--s4)}
.games a{display:flex;flex-direction:column;align-items:center;gap:var(--s3);text-align:center;color:var(--text);padding:var(--s5) var(--s3);transition:.18s}
.games a:hover{text-decoration:none;border-color:var(--text-2);transform:translateY(-3px)}
.games b{font-size:var(--fs-sm)}
.games span{font-size:var(--fs-xs);color:var(--text-2)}

/* Fichas */
.profile{display:flex;align-items:center;gap:var(--s5)}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gutter)}
.kv div{display:flex;flex-direction:column;gap:var(--s1)}
.kv dt{font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--text-2);font-weight:600}
.kv dd{font-family:var(--f-display);font-size:var(--fs-md);font-weight:600}
.notice{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s4);border-radius:var(--r-sm);font-size:var(--fs-sm);border:1px solid}
.notice.info{background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.3);color:#BDF4FB}
.notice.warn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);color:#FDE7A8}
.empty{text-align:center;padding:var(--s8) var(--s5);color:var(--text-2)}
.empty .ic{width:64px;height:64px;margin:0 auto var(--s4);border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2)}
.empty .ic svg{width:28px;height:28px}
.empty h3{color:var(--text);margin-bottom:var(--s2)}
.empty .btn{margin-top:var(--s5)}

/* Modal y toast */
.overlay{position:fixed;inset:0;background:rgba(5,8,15,.7);backdrop-filter:blur(4px);display:none;place-items:center;z-index:50;padding:var(--s4)}
.overlay.open{display:grid}
.modal{max-width:440px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:var(--s6);box-shadow:var(--shadow)}
.modal .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(248,113,113,.12);color:var(--danger);margin-bottom:var(--s4)}
.modal p{color:var(--text-2);margin:var(--s2) 0 var(--s5)}
.modal .row{display:flex;gap:var(--s3);justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:var(--s5);transform:translate(-50%,150%);display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s5);border-radius:var(--r-sm);background:var(--surface-2);border:1px solid rgba(52,211,153,.4);color:var(--text);font-size:var(--fs-sm);font-weight:500;box-shadow:var(--shadow);transition:.3s;z-index:60;opacity:0;visibility:hidden}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast svg{color:var(--ok)}
.toast.err{border-color:rgba(248,113,113,.5)}.toast.err svg{color:var(--danger)}
footer{border-top:1px solid var(--border);padding:var(--s5) 0;color:var(--text-2);font-size:var(--fs-xs)}
footer .container{display:flex;justify-content:space-between;gap:var(--s4);flex-wrap:wrap}

/* =========================================================
   ADAPTACIÓN MÓVIL
   ========================================================= */
@media (max-width:1024px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .quick{grid-template-columns:repeat(2,1fr)}
  .games{grid-template-columns:repeat(3,1fr)}
  .nav a span{display:none}
}
@media (max-width:720px){
  :root{--gutter:16px;--fs-display:2.25rem;--fs-xxl:1.9375rem;--fs-xl:1.5625rem}
  .topbar .container{height:56px}
  .nav,.topbar .btn{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(19,26,43,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10px;font-weight:600;color:var(--text-2);border-radius:8px}
  .tabbar a svg{width:22px;height:22px}
  .tabbar a.on{color:var(--accent)}
  .tabbar a:hover{text-decoration:none}
  body{padding-bottom:76px}
  main.container{padding-top:var(--s5);padding-bottom:var(--s7)}
  .cards,.quick,.stats,.kv{grid-template-columns:1fr 1fr}
  .cards{grid-template-columns:1fr}
  .games{grid-template-columns:repeat(2,1fr)}
  .grid>*{grid-column:span 12!important}
  .hero{padding:var(--s6) var(--s5);border-radius:16px}
  .hero::after,.hero::before{display:none}
  .hero .acts .btn{flex:1}
  .page-head{flex-direction:column;align-items:stretch;margin-bottom:var(--s5)}
  .page-head .acts .btn{flex:1}
  .filters{flex-direction:column;align-items:stretch}
  .seg{display:grid;grid-template-columns:repeat(2,1fr)}
  .seg a{justify-content:center}
  .form-grid{grid-template-columns:1fr}
  .form-actions{flex-direction:column-reverse}
  .form-actions .btn{width:100%}
  .profile{flex-direction:column;align-items:flex-start;gap:var(--s4)}
  .stat b{font-size:var(--fs-lg)}
  /* Tablas → filas apiladas */
  .table-wrap.stackable{background:none;border:0}
  .stackable thead{display:none}
  .stackable tr{display:grid;grid-template-columns:1fr;gap:var(--s2) var(--s4);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s4);margin-bottom:var(--s3)}
  .stackable td{border:0;padding:0;display:flex;align-items:center;gap:var(--s2)}
  .stackable td[data-l]::before{content:attr(data-l);font-size:var(--fs-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--text-2);font-weight:600;min-width:70px}
  .stackable td.first{grid-column:1/-1}
  .stackable td.actions{grid-column:1/-1;display:flex;justify-content:flex-start;padding-top:var(--s3);border-top:1px solid var(--border)}
  .stackable td.num{justify-content:flex-start}
  .modal .row{flex-direction:column-reverse}
  .modal .row .btn{width:100%}
  footer{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="container">
    <a class="brand" href="#/"><span class="logo">GA</span><span>Game<b>Arena</b></span></a>
    <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
    <a class="btn btn-primary btn-sm" href="#/torneos/nuevo" style="height:40px"><svg class="i"><use href="#i-plus"/></svg>Nuevo torneo</a>
  </div>
</header>

<main id="app" class="container" tabindex="-1"></main>

<footer><div class="container"><span>GameArena · Plataforma de competiciones de videojuegos · <b id="modo" style="color:var(--accent);font-weight:600">Conectando…</b></span><span>DIW · 2.º DAW · IES Juan García Valdemora · Miguel Luzón Prado</span></div></footer>

<nav class="tabbar" id="tabbar" aria-label="Navegación móvil"></nav>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal">
    <div class="ic"><svg class="i"><use href="#i-trash"/></svg></div>
    <h3 id="mTitle">¿Eliminar?</h3>
    <p id="mText"></p>
    <div class="row"><button class="btn btn-secondary" id="mNo">Cancelar</button><button class="btn btn-danger" id="mYes"><svg class="i"><use href="#i-trash"/></svg>Eliminar</button></div>
  </div>
</div>
<div class="toast" id="toast" role="status"><svg class="i"><use href="#i-check"/></svg><span id="toastText"></span></div>

<!-- Iconos -->
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></symbol>
  <symbol id="i-pad" viewBox="0 0 24 24"><path d="M6 8h12a4 4 0 0 1 4 4v1a4 4 0 0 1-7 2.6l-.5-.6h-5l-.5.6A4 4 0 0 1 2 13v-1a4 4 0 0 1 4-4zM7 11v3M5.5 12.5h3M16 12h.01M18 14h.01"/></symbol>
  <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3 8a2 2 0 0 0 0 4v-4zM3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4zM14 7v10" stroke-dasharray="0"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>

/* =========================================================
   CONEXIÓN CON LA API REST DEL PROYECTO (Spring Boot · puerto 8080)
   Si el servidor no está encendido, la web sigue funcionando con
   los datos de demostración de arriba (modo demo).
   ========================================================= */
// Solo se conecta a la API cuando la web la sirve Spring Boot (http://localhost:8080/diw/).
// Abierta como archivo o desde GitHub Pages usa siempre los datos de demostración.
const USAR_API = location.port==="8080";
const API = "";
let MODO="demo";
let DB=JSON.parse(JSON.stringify(SEED));
let FILTRADOS=null;
const ESTILO_JUEGOS={"valorant":["VAL","#FF4655","#8C1C2A"],"league of legends":["LOL","#C8AA6E","#0A6E8C"],"rocket league":["RL","#1F8BFF","#FF8A1F"],"fortnite":["FN","#9D4DFF","#2AB7F6"],"ea sports fc":["FC","#00C26E","#0F3D2A"]};
const OTROS=[["#6D4AFF","#22D3EE"],["#F472B6","#7C3AED"],["#F59E0B","#B45309"],["#14B8A6","#0E7490"]];
function decorar(v){const e=ESTILO_JUEGOS[(v.nombre||"").toLowerCase()];if(e)return {...v,abr:e[0],c1:e[1],c2:e[2]};
  const abr=(v.nombre||"?").split(/\s+/).map(w=>w[0]).join("").slice(0,3).toUpperCase();const c=OTROS[v.id%OTROS.length];return {...v,abr,c1:c[0],c2:c[1]}}
const normT=t=>({...t,premio:Number(t.premio),videojuegoId:t.videojuego?t.videojuego.id:t.videojuegoId});
const normP=x=>({...x,jugadorId:x.jugador?x.jugador.id:x.jugadorId,torneoId:x.torneo?x.torneo.id:x.torneoId});
function mensajeError(status){if(status===400)return "Datos incorrectos (400)";if(status===404)return "No encontrado (404)";if(status===409)return "Ya existe (409)";return "Error "+status}
async function api(ruta,metodo="GET",cuerpo){
  const op={method:metodo};
  if(cuerpo!==undefined){op.headers={"Content-Type":"application/json"};op.body=JSON.stringify(cuerpo)}
  const r=await fetch(API+ruta,op);
  if(!r.ok) throw new Error(mensajeError(r.status));
  if(r.status===204) return null;
  const txt=await r.text(); return txt?JSON.parse(txt):null;
}
async function cargarDatos(){
  if(!USAR_API){ MODO="demo"; const m0=$("#modo"); if(m0) m0.textContent="Datos de demostración"; return; }
  try{
    const [v,j,t,p]=await Promise.all(["/videojuegos","/jugadores","/torneos","/participaciones"].map(r=>api(r)));
    DB={videojuegos:v.map(decorar),jugadores:j,torneos:t.map(normT),participaciones:p.map(normP)};
    MODO="api";
  }catch(e){ if(MODO==="api") toast("No se puede conectar con el servidor",true); MODO="demo"; }
  const m=$("#modo"); if(m) m.textContent = MODO==="api" ? "Conectado a la API · localhost:8080" : "Datos de demostración";
}

/* ---------- Utilidades ---------- */

const badge=e=>`<span class="badge st-${e}">${ESTADOS[e].i}${ESTADOS[e].t}</span>`;

const partsDe=tid=>DB.participaciones.filter(p=>p.torneoId==tid);
const crumbs=(...items)=>`<nav class="crumbs" aria-label="Estás en">${items.map((x,i)=>i<items.length-1?`<a href="${x[1]}">${esc(x[0])}</a>${ic("chev")}`:`<span>${esc(x[0])}</span>`).join("")}</nav>`;
const pos=n=>n>0?`<span class="pos ${n<=3?"p"+n:""}">${n}</span>`:`<span class="muted small">—</span>`;
function toast(t,err){$("#toastText").textContent=t;$("#toast").classList.toggle("err",!!err);$("#toast").querySelector("use").setAttribute("href",err?"#i-alert":"#i-check");$("#toast").classList.add("show");clearTimeout(toast.k);toast.k=setTimeout(()=>$("#toast").classList.remove("show"),2600)}
function confirmar(titulo,texto,ok){$("#mTitle").textContent=titulo;$("#mText").textContent=texto;$("#overlay").classList.add("open");$("#mNo").focus();
  $("#mYes").onclick=()=>{$("#overlay").classList.remove("open");ok()};$("#mNo").onclick=()=>$("#overlay").classList.remove("open")}
$("#overlay").addEventListener("click",e=>{if(e.target.id==="overlay")e.target.classList.remove("open")});

/* ---------- Navegación ---------- */
const SECCIONES=[["Inicio","#/","home"],["Torneos","#/torneos","trophy"],["Jugadores","#/jugadores","users"],["Videojuegos","#/videojuegos","pad"],["Participaciones","#/participaciones","ticket"]];
function pintarNav(path){

function cardTorneo(t){

    <div class="foot"><div class="prize"><small>Premio</small>${euros(t.premio)}</div><span class="link-more">Ver torneo ${ic("arrow")}</span></div>

const V={};
V.inicio=()=>{

/* ----- TORNEOS ----- */
V.torneos=(q)=>{
  const estado=q.get("estado")||"", jid=q.get("juego")||"", vista=q.get("vista");
  let lista=FILTRADOS?FILTRADOS.slice():DB.torneos.filter(t=>(!estado||t.estado===estado)&&(!jid||t.videojuegoId==jid));
  const orden={ABIERTO:0,EN_CURSO:1,FINALIZADO:2};
  lista.sort((a,b)=>orden[a.estado]-orden[b.estado]||a.fecha.localeCompare(b.fecha));
  const url=(e,j)=>{const p=new URLSearchParams();if(e)p.set("estado",e);if(j)p.set("juego",j);if(vista)p.set("vista",vista);const s=p.toString();return "#/torneos"+(s?"?"+s:"")};
  const segs=[["","Todos"],["ABIERTO","Abierto"],["EN_CURSO","En curso"],["FINALIZADO","Finalizado"]].map(([e,t])=>`<a href="${url(e,jid)}" class="${estado===e?"on":""}">${e?`<span class="dot" style="color:var(--${e==="ABIERTO"?"ok":e==="EN_CURSO"?"warn":"muted"})"></span>`:""}${t}</a>`).join("");

    : vista==="tabla" ? tablaTorneos(lista) : `<div class="cards">${lista.map(cardTorneo).join("")}</div>`;
  return `${crumbs(["Inicio","#/"],["Torneos"])}
  <div class="page-head"><div><h1>Torneos</h1><p>Todas las competiciones de GameArena. Filtra por estado, por videojuego o combina ambos.</p></div>
  <div class="acts"><a class="btn btn-primary" href="#/torneos/nuevo">${ic("plus")}Nuevo torneo</a></div></div>

    <div class="field"><span class="label">Estado</span><div class="seg">${segs}</div></div>

  </div>
  <div class="result-line"><span><b style="color:var(--text)">${lista.length}</b> ${lista.length===1?"torneo":"torneos"}</span>${chips.join("")}${chips.length?`<a href="#/torneos" class="small">Limpiar filtros</a>`:""}</div>
  ${res}`;
};
function tablaTorneos(lista){
  return `<div class="table-wrap stackable"><table><thead><tr><th>Torneo</th><th>Videojuego</th><th>Fecha</th><th class="num">Premio</th><th>Estado</th><th></th></tr></thead><tbody>

  </tbody></table></div>`;
}
V.torneo=(id)=>{

   ROUTER
   ========================================================= */
async function router(){
  const h=location.hash.slice(1)||"/";
  const [path,qs]=h.split("?"); const q=new URLSearchParams(qs||""); const p=path.split("/").filter(Boolean);
  await cargarDatos();
  FILTRADOS=null;
  // Filtros de torneos: se piden a la API con sus rutas
  if(MODO==="api" && p[0]==="torneos" && !p[1] && (q.get("estado")||q.get("juego"))){
    const e=q.get("estado"), j=q.get("juego");
    const ruta = e&&j ? `/torneos/videojuego/${j}/estado/${e}` : j ? `/torneos/videojuego/${j}` : `/torneos/estado/${e}`;
    try{ FILTRADOS=(await api(ruta)).map(normT) }catch(err){ toast(err.message,true) }
  }
  let html;
  if(!p.length) html=V.inicio();
  else if(p[0]==="torneos"){ html=!p[1]?V.torneos(q):p[1]==="nuevo"?formTorneo():p[2]==="editar"?(tor(p[1])?formTorneo(tor(p[1])):V.no()):V.torneo(p[1]); }
  else if(p[0]==="jugadores"){ html=!p[1]?V.jugadores(q):p[1]==="nuevo"?formJugador():p[2]==="editar"?(jug(p[1])?formJugador(jug(p[1])):V.no()):V.jugador(p[1]); }
  else if(p[0]==="videojuegos"){ html=!p[1]?V.videojuegos():V.videojuego(p[1]); }
  else if(p[0]==="participaciones"){ html=p[1]==="inscribir"?V.inscribir(q):V.participaciones(q); }
  else html=V.no();
  $("#app").innerHTML=html; pintarNav(path);
  const titulo=$("#app h1"); document.title=(titulo?titulo.textContent+" · ":"")+"GameArena";
  if(!router.first) window.scrollTo(0,0); router.first=false;
  enlazar();
}
router.first=true;
function ir(hash){ if(location.hash===hash) router(); else location.hash=hash; }

/* ---------- Operaciones: en la API si está conectada, si no en memoria ---------- */
async function borrarTorneo(t){
  if(MODO==="api") await api("/torneos/"+t.id,"DELETE");
  else { DB.torneos=DB.torneos.filter(x=>x.id!==t.id); DB.participaciones=DB.participaciones.filter(p=>p.torneoId!==t.id); }
}
async function borrarJugador(j){
  if(MODO==="api") await api("/jugadores/"+j.id,"DELETE");
  else { DB.jugadores=DB.jugadores.filter(x=>x.id!==j.id); DB.participaciones=DB.participaciones.filter(p=>p.jugadorId!==j.id); }
}
async function guardarTorneo(id,datos){
  const cuerpo={nombre:datos.nombre,fecha:datos.fecha,premio:datos.premio,estado:datos.estado};
  if(MODO==="api"){
    const r = id ? await api("/torneos/"+id,"PUT",cuerpo) : await api("/torneos?videojuegoId="+datos.videojuegoId,"POST",cuerpo);
    return r&&r.id ? r.id : id;
  }
  if(id){ Object.assign(tor(id),datos); return id; }
  const t={id:nextId(DB.torneos),...datos}; DB.torneos.push(t); return t.id;
}
async function guardarJugador(id,datos){
  if(MODO==="api"){
    const r = id ? await api("/jugadores/"+id,"PUT",datos) : await api("/jugadores","POST",datos);
    return r&&r.id ? r.id : id;
  }
  if(id){ Object.assign(jug(id),datos); return id; }
  const j={id:nextId(DB.jugadores),...datos}; DB.jugadores.push(j); return j.id;
}
async function inscribir(jugadorId,torneoId,puntos,posicion){
  if(MODO==="api") await api(`/participaciones?jugadorId=${jugadorId}&torneoId=${torneoId}`,"POST",{puntos,posicion});
  else DB.participaciones.push({id:nextId(DB.participaciones),jugadorId:+jugadorId,torneoId:+torneoId,puntos,posicion});
}

function marcar(campo,ok){campo.closest(".field").classList.toggle("bad",!ok);return ok}
function enlazar(){
  const fj=$("#fJuego"); if(fj) fj.onchange=()=>{const q=new URLSearchParams(location.hash.split("?")[1]||"");fj.value?q.set("juego",fj.value):q.delete("juego");location.hash="#/torneos"+(q.toString()?"?"+q:"")};
  const bj=$("#bJug"); if(bj){bj.oninput=()=>{clearTimeout(bj.k);bj.k=setTimeout(async()=>{location.hash="#/jugadores"+(bj.value?"?q="+encodeURIComponent(bj.value):"");setTimeout(()=>{const n=$("#bJug");if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}},400)},300)}}
  const ps=$("#pSel"); if(ps) ps.onchange=()=>location.hash=`#/participaciones?modo=${ps.dataset.modo}`+(ps.value?"&id="+ps.value:"");
  document.querySelectorAll("[data-del-torneo]").forEach(b=>b.onclick=()=>{const t=tor(b.dataset.delTorneo);
    confirmar("¿Eliminar torneo?",`Se eliminará «${t.nombre}» y sus ${partsDe(t.id).length} inscripciones. Esta acción no se puede deshacer.`,async()=>{
      try{await borrarTorneo(t);toast("Torneo eliminado");ir("#/torneos")}catch(e){toast("No se pudo eliminar: "+e.message,true)}})});
  document.querySelectorAll("[data-del-jugador]").forEach(b=>b.onclick=()=>{const j=jug(b.dataset.delJugador);
    confirmar("¿Eliminar jugador?",`Se eliminará a ${j.nick} y todas sus participaciones. Esta acción no se puede deshacer.`,async()=>{
      try{await borrarJugador(j);toast("Jugador eliminado");ir("#/jugadores")}catch(e){toast("No se pudo eliminar: "+e.message,true)}})});

  const ft=$("#fTorneo"); if(ft) ft.onsubmit=async e=>{e.preventDefault();
    const n=$("#tNombre"),v=$("#tJuego"),f=$("#tFecha"),pr=$("#tPremio");
    const ok=[marcar(n,n.value.trim().length>=3),marcar(v,!!v.value),marcar(f,!!f.value),marcar(pr,pr.value!==""&&+pr.value>=0)].every(Boolean);
    if(!ok){ft.querySelector(".bad .input").focus();return}
    const datos={nombre:n.value.trim(),videojuegoId:+v.value,fecha:f.value,premio:+pr.value,estado:ft.tEstado.value};
    const seg=location.hash.split("?")[0].split("/")[2]; const id=seg!=="nuevo"?+seg:null;
    try{const nid=await guardarTorneo(id,datos);toast(id?"Cambios guardados":"Torneo creado");ir(nid?"#/torneos/"+nid:"#/torneos")}catch(err){toast("No se pudo guardar: "+err.message,true)}};
  const fjug=$("#fJugador"); if(fjug) fjug.onsubmit=async e=>{e.preventDefault();
    const n=$("#jNick"),m=$("#jEmail"),l=$("#jNivel");
    const ok=[marcar(n,n.value.trim().length>=3),marcar(m,/^\S+@\S+\.\S+$/.test(m.value)),marcar(l,+l.value>=1&&+l.value<=100)].every(Boolean);
    if(!ok){fjug.querySelector(".bad .input").focus();return}
    const datos={nick:n.value.trim(),email:m.value.trim(),nivel:+l.value};
    const seg=location.hash.split("?")[0].split("/")[2]; const id=seg!=="nuevo"?+seg:null;
    try{const nid=await guardarJugador(id,datos);toast(id?"Cambios guardados":"Jugador creado");ir(nid?"#/jugadores/"+nid:"#/jugadores")}catch(err){toast("No se pudo guardar: "+err.message,true)}};
  const fi=$("#fInscribir"); if(fi) fi.onsubmit=async e=>{e.preventDefault();
    const j=$("#iJug"),t=$("#iTor");
    let ok=[marcar(j,!!j.value),marcar(t,!!t.value)].every(Boolean);
    if(ok&&DB.participaciones.some(p=>p.jugadorId==j.value&&p.torneoId==t.value)){$("#iTorErr").innerHTML=ic("alert")+"Este jugador ya está inscrito en ese torneo.";marcar(t,false);ok=false}
    else $("#iTorErr").innerHTML=ic("alert")+"Selecciona un torneo.";
    if(!ok){fi.querySelector(".bad .input").focus();return}
    const nick=jug(j.value).nick, nom=tor(t.value).nombre;
    try{await inscribir(j.value,t.value,+$("#iPts").value||0,+$("#iPos").value||0);toast(`${nick} inscrito en ${nom}`);ir("#/torneos/"+t.value)}catch(err){toast("No se pudo inscribir: "+err.message,true)}};
  document.querySelectorAll(".field .input").forEach(i=>i.addEventListener("input",()=>i.closest(".field").classList.remove("bad")));
}
window.addEventListener("hashchange",router);
router();
</script>
</body>
